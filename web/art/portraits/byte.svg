<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
  <!-- Byte, the owl of commands and hardening: blue and white with a holographic sheen, gold eyes. Painted in flat
       tones with a dark outline, as a 16-bit portrait is; light from the top-left. Source of the 64 x 64 and
       96 x 96 portraits. -->
  <defs>
    <clipPath id="body"><ellipse cx="384" cy="420" rx="226" ry="226"/></clipPath>
    <clipPath id="belly"><ellipse cx="384" cy="500" rx="140" ry="140"/></clipPath>
  </defs>
  <rect width="768" height="768" fill="#1c3a78"/>
  <rect y="560" width="768" height="80" fill="#142046"/>
  <g stroke="#2560a8" stroke-width="14" fill="none"><path d="M0 120 H 140 V 60 H 260"/><path d="M640 80 V 200 H 720"/></g>
  <!-- the perch -->
  <rect y="640" width="768" height="128" fill="#553222"/><rect y="640" width="768" height="24" fill="#ab7a44"/>
  <!-- ear tufts, lit and shaded -->
  <path d="M176 250 L 214 80 L 316 210 Z" fill="#3b8cd0" stroke="#142046" stroke-width="14" stroke-linejoin="round"/>
  <path d="M592 250 L 554 80 L 452 210 Z" fill="#2560a8" stroke="#142046" stroke-width="14" stroke-linejoin="round"/>
  <!-- body: base, shade on the right, light on the upper left -->
  <g clip-path="url(#body)">
    <rect x="150" y="190" width="470" height="520" fill="#3b8cd0"/>
    <ellipse cx="640" cy="470" rx="190" ry="300" fill="#2560a8"/>
    <ellipse cx="250" cy="300" rx="80" ry="110" fill="#73c0e8"/>
  </g>
  <ellipse cx="384" cy="420" rx="226" ry="226" fill="none" stroke="#142046" stroke-width="16"/>
  <!-- belly with chevron feathers -->
  <g clip-path="url(#belly)">
    <rect x="240" y="370" width="290" height="320" fill="#fbf7e8"/>
    <ellipse cx="520" cy="560" rx="80" ry="190" fill="#c8f0ff"/>
  </g>
  <g stroke="#3b8cd0" stroke-width="14" fill="none" stroke-linecap="square"><path d="M318 466 l 22 18 l 22 -18"/><path d="M406 466 l 22 18 l 22 -18"/><path d="M362 528 l 22 18 l 22 -18"/><path d="M318 590 l 22 18 l 22 -18"/><path d="M406 590 l 22 18 l 22 -18"/></g>
  <!-- face discs with a dark rim -->
  <ellipse cx="298" cy="330" rx="100" ry="92" fill="#fbf7e8" stroke="#142046" stroke-width="14"/>
  <ellipse cx="470" cy="330" rx="100" ry="92" fill="#c8f0ff" stroke="#142046" stroke-width="14"/>
  <!-- eyes: gold iris with a darker ring, a big pupil and one white glint -->
  <circle cx="298" cy="330" r="56" fill="#b07818"/><circle cx="298" cy="330" r="44" fill="#f0c030"/>
  <circle cx="470" cy="330" r="56" fill="#b07818"/><circle cx="470" cy="330" r="44" fill="#f0c030"/>
  <circle cx="302" cy="336" r="26" fill="#140c1c"/><circle cx="466" cy="336" r="26" fill="#140c1c"/>
  <rect x="270" y="298" width="22" height="22" fill="#fbf7e8"/><rect x="442" y="298" width="22" height="22" fill="#fbf7e8"/>
  <!-- beak, lit on the left, outlined -->
  <path d="M346 382 L 422 382 L 384 470 Z" fill="#f0c030" stroke="#142046" stroke-width="12" stroke-linejoin="round"/>
  <path d="M384 390 L 412 390 L 384 456 Z" fill="#b07818"/>
  <!-- holographic sheen: two bright streaks across the lit side -->
  <path d="M206 330 C 214 260, 250 220, 300 200" stroke="#d8ffff" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M190 430 C 192 400, 200 380, 212 364" stroke="#5ef0ff" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- feet on the perch -->
  <g fill="#f0c030" stroke="#142046" stroke-width="8"><rect x="296" y="616" width="26" height="36"/><rect x="334" y="616" width="26" height="36"/><rect x="408" y="616" width="26" height="36"/><rect x="446" y="616" width="26" height="36"/></g>
</svg>
